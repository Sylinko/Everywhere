<title>Text fragment separator probe</title>
<style>body { font: 20px sans-serif; max-width: 850px; margin: 30px; } section { margin: 18px 0; }</style>
<body>
  <section aria-label="English inline"><p>Hello <strong>bold</strong> world.</p></section>
  <section aria-label="Chinese inline"><p>这是一段<strong>加粗</strong>中文。</p></section>
