name: (Linux) Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build or retry, including v
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            runner: ubuntu-24.04
            asset_name: Linux-x64
          - runtime: linux-arm64
            runner: ubuntu-24.04-arm
            asset_name: Linux-arm64

    runs-on: ${{ matrix.runner }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.tag || github.ref }}
        fetch-depth: 0
        submodules: true
        lfs: true

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Resolve version
      env:
        RELEASE_TAG_INPUT: ${{ inputs.tag || github.ref_name }}
      run: node scripts/resolve-release-tag.mjs "$RELEASE_TAG_INPUT"

    - name: Setup .NET
      uses: actions/setup-dotnet@v5.2.0
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: |
        dotnet restore Everywhere.Linux.slnx \
          -r ${{ matrix.runtime }}

    - name: Install packaging and NativeAOT dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang zlib1g-dev dpkg-dev squashfs-tools zstd desktop-file-utils

    - name: Publish
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        AI_GATEWAY_BASE_URL: ${{ vars.AI_GATEWAY_BASE_URL }}
        ACCOUNT_BASE_URL: ${{ vars.ACCOUNT_BASE_URL }}
        CLOUD_SYNC_BASE_URL: ${{ vars.CLOUD_SYNC_BASE_URL }}
      run: |
        dotnet publish src/Everywhere.Linux/Everywhere.Linux.csproj \
          -c Release \
          -r ${{ matrix.runtime }} \
          -o ./publish \
          -p:Version="$VERSION_PREFIX" \
          -p:SemanticVersion="$SEMANTIC_VERSION" \
          /p:SentryDsn="$SENTRY_DSN" \
          /p:ClientId="$CLIENT_ID" \
          /p:AIGatewayBaseUrl="$AI_GATEWAY_BASE_URL" \
          /p:AccountBaseUrl="$ACCOUNT_BASE_URL" \
          /p:CloudSyncBaseUrl="$CLOUD_SYNC_BASE_URL" \
          --self-contained true \
          --no-restore

    - name: Build Deb Package
      run: |
        chmod +x ./src/Everywhere.Linux/packaging_deb.sh
        ./src/Everywhere.Linux/packaging_deb.sh ${{ matrix.runtime }} ${{ env.VERSION }} ./publish

    - name: Create Archive
      run: |
        tar -I 'zstd -19 -T0' -cf Everywhere-${{ matrix.asset_name }}-v${{ env.VERSION }}.tar.zst -C ./publish .

    - name: Build AppImage
      run: |
        bash src/Everywhere.Linux/build-appimage.sh ${{ matrix.runtime }} ${{ matrix.asset_name }} ./publish false "$VERSION" "$SEMANTIC_VERSION"

    - name: Validate package metadata
      run: |
        dpkg-deb --info "Everywhere-${{ matrix.asset_name }}-v${VERSION}.deb"
        test -s "Releases/Everywhere-${{ matrix.asset_name }}-v${VERSION}.AppImage"
        test -s "Everywhere-${{ matrix.asset_name }}-v${VERSION}.tar.zst"

    - name: Collect Linux assets
      uses: actions/upload-artifact@v4
      with:
        name: linux-${{ matrix.runtime }}
        if-no-files-found: error
        path: |
          Everywhere-${{ matrix.asset_name }}-v${{ env.VERSION }}.deb
          Releases/Everywhere-${{ matrix.asset_name }}-v${{ env.VERSION }}.AppImage
          Everywhere-${{ matrix.asset_name }}-v${{ env.VERSION }}.tar.zst

  release-linux:
    needs: build-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Resolve version
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag || github.ref_name }}
        run: node scripts/resolve-release-tag.mjs "$RELEASE_TAG_INPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          merge-multiple: true
          path: release-assets
      - name: Preserve existing release publication state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/github_release.py
      - name: Upload complete Linux release
        uses: softprops/action-gh-release@v3
        with:
          draft: ${{ steps.state.outputs.draft }}
          prerelease: ${{ steps.state.outputs.prerelease }}
          make_latest: false
          tag_name: ${{ env.RELEASE_TAG }}
          fail_on_unmatched_files: true
          files: |
            release-assets/**/Everywhere-Linux-*-v${{ env.VERSION }}.deb
            release-assets/**/Everywhere-Linux-*-v${{ env.VERSION }}.AppImage
            release-assets/**/Everywhere-Linux-*-v${{ env.VERSION }}.tar.zst

  notify-aur:
    needs: release-linux
    uses: ./.github/workflows/aur-publish.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      EVERYWHERE_AUR_DISPATCH_TOKEN: ${{ secrets.EVERYWHERE_AUR_DISPATCH_TOKEN }}
