name: Notify AUR maintainer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, including v
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      EVERYWHERE_AUR_DISPATCH_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Dispatch a published Linux release
        env:
          GH_TOKEN: ${{ github.token }}
          EVERYWHERE_AUR_DISPATCH_TOKEN: ${{ secrets.EVERYWHERE_AUR_DISPATCH_TOKEN }}
          AUR_MIRROR_REPOSITORY: ${{ vars.AUR_MIRROR_REPOSITORY }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: python3 scripts/notify-aur.py
