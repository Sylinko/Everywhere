name: LLM SDK integration

on:
  workflow_dispatch:
    inputs:
      captures:
        description: Also replay the pinned provider captures
        type: boolean
        default: true
  pull_request:
    paths:
      - 'src/Everywhere.Core/Harness/**'
      - 'src/Everywhere.Core/AI/Assistant/**'
      - 'src/Everywhere.Core/Common/ChatRequestException.cs'
      - 'src/Everywhere.Core/Common/HandledChatException*.cs'
      - 'src/Everywhere.Core/Chat/ChatService*.cs'
      - 'src/Everywhere.Abstractions/AI/**'
      - 'src/Everywhere.Abstractions/Cloud/ApiPayload.cs'
      - 'tests/Everywhere.AI.Tests/**'
      - 'tests/Directory.Packages.props'
      - 'patches/**'
      - 'src/Build.Patches.targets'
      - 'Directory.*.props'
      - 'global.json'
      - 'tools/test_llm.ps1'
      - '.github/workflows/llm-integration.yml'

permissions:
  contents: read

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Initialize production dependency sources
        run: git submodule update --init --depth 1 3rd/shad-ui 3rd/skills
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Run required SDK integration tests
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./tools/test_llm.ps1 -Runtime Docker -Configuration Release -ResultsDirectory artifacts/llm-tests/ci
      - name: Read capture revision
        if: github.event_name == 'pull_request' || inputs.captures
        id: fixtures
        run: echo "rev=$(cat tests/Everywhere.AI.Tests/Fixtures/captured.rev)" >> "$GITHUB_OUTPUT"
      - name: Check out captured fixtures
        if: steps.fixtures.outcome == 'success'
        uses: actions/checkout@v6
        with:
          repository: Sylinko/llm-fixtures
          ref: ${{ steps.fixtures.outputs.rev }}
          path: .llm-fixtures
          persist-credentials: false
      - name: Replay captured SDK exchanges
        if: steps.fixtures.outcome == 'success'
        shell: pwsh
        run: ./tools/test_llm.ps1 -Runtime Docker -Configuration Release -FixturesPath .llm-fixtures -ResultsDirectory artifacts/llm-tests/ci/captured
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llm-sdk-results
          path: artifacts/llm-tests/ci
