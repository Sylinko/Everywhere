name: (Windows) Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Enable long paths in git
      run: git config --global core.longpaths true

    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: true
        lfs: true

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Resolve version
      shell: pwsh
      run: node scripts/resolve-release-tag.mjs "$env:GITHUB_REF_NAME"

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: global.json

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Install Inno Setup
      shell: pwsh
      run: |
        choco install innosetup

    - name: Install SimplySignDesktop
      shell: pwsh
      run: |
        $msiPath = "tools/sign_windows/SimplySignDesktop-9.3.3.71-64-bit-en.msi"
        if (-not (Test-Path $msiPath)) {
            Write-Error "MSI file not found at: $msiPath"
            exit 1
        }

        $absMsiPath = Convert-Path $msiPath
        $logPath = "$PWD\install.log"

        Write-Host "Installing SimplySignDesktop from $absMsiPath..."
        # Use /qn for completely silent installation (no UI) and ALLUSERS=1 to force machine-wide install
        $process = Start-Process msiexec -ArgumentList "/i `"$absMsiPath`" /qn /norestart ALLUSERS=1 /l*v `"$logPath`"" -Wait -PassThru
        
        if ($process.ExitCode -ne 0) {
            Write-Host "SimplySignDesktop installation failed with exit code $($process.ExitCode)"
            if (Test-Path $logPath) {
                Write-Host "----------------------------------------------------------------"
                Write-Host "Install Log Content:"
                Write-Host "----------------------------------------------------------------"
                Get-Content $logPath
                Write-Host "----------------------------------------------------------------"
            } else {
                Write-Host "Log file not found at $logPath"
            }
            exit $process.ExitCode
        }
        Write-Host "SimplySignDesktop installed successfully."

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Install Workloads
      run: dotnet workload restore src/Everywhere.Windows/Everywhere.Windows.csproj

    - name: Restore
      shell: pwsh
      run: |
        dotnet restore Everywhere.Windows.slnx -r win-x64

    - name: Publish Everywhere.Windows
      shell: pwsh
      env:
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        CLIENT_ID: ${{ secrets.CLIENT_ID }}
        AI_GATEWAY_BASE_URL: ${{ vars.AI_GATEWAY_BASE_URL }}
        ACCOUNT_BASE_URL: ${{ vars.ACCOUNT_BASE_URL }}
        CLOUD_SYNC_BASE_URL: ${{ vars.CLOUD_SYNC_BASE_URL }}
      run: |
        dotnet publish src/Everywhere.Windows/Everywhere.Windows.csproj `
          -c Release `
          --self-contained true `
          -p:Version="$env:VERSION_PREFIX" `
          -p:SemanticVersion="$env:SEMANTIC_VERSION" `
          -p:SentryDsn="$env:SENTRY_DSN" `
          -p:ClientId="$env:CLIENT_ID" `
          -p:AIGatewayBaseUrl="$env:AI_GATEWAY_BASE_URL" `
          -p:AccountBaseUrl="$env:ACCOUNT_BASE_URL" `
          -p:CloudSyncBaseUrl="$env:CLOUD_SYNC_BASE_URL" `
          -o ./publish `
          --no-restore

    # 步骤 1：下载并安装 SimplySignDesktop
    - name: Download and Install SimplySignDesktop
      shell: pwsh
      env:
        CERTUM_VERSION: "9.4.4.92"   # 可按需更新
      run: |
        $version = $env:CERTUM_VERSION
        $url = "https://files.certum.eu/software/SimplySignDesktop/Windows/$version/SimplySignDesktop-$version-64-bit-en.msi"
        $msiPath = "$env:TEMP\SimplySignDesktop-$version.msi"
        $logPath = "$env:TEMP\install.log"

        Write-Host "Downloading SimplySignDesktop from: $url"
        $retryCount = 0
        $maxRetries = 3
        do {
          try {
            Invoke-WebRequest -Uri $url -OutFile $msiPath -UseBasicParsing -ErrorAction Stop
            $downloadSuccess = $true
          } catch {
            $retryCount++
            Write-Warning "Download attempt $retryCount failed: $_"
            if ($retryCount -ge $maxRetries) {
              Write-Error "Failed to download after $maxRetries attempts."
              exit 1
            }
            Start-Sleep -Seconds 2
          }
        } while (-not $downloadSuccess -and $retryCount -lt $maxRetries)

        Write-Host "Installing SimplySignDesktop..."
        $proc = Start-Process msiexec -ArgumentList "/i `"$msiPath`" /qn /norestart ALLUSERS=1 /l*v `"$logPath`"" -Wait -PassThru
        if ($proc.ExitCode -ne 0) {
          Write-Error "Installation failed with exit code $($proc.ExitCode)"
          if (Test-Path $logPath) {
            Write-Host "Install log (last 50 lines):"
            Get-Content $logPath -Tail 50
          }
          exit $proc.ExitCode
        }
        Write-Host "SimplySignDesktop installed successfully."
        Remove-Item $msiPath -Force

    # 步骤 2：登录并等待证书注入，然后签名所有二进制文件 + 编译安装包
    - name: Login, Sign and Build Installer
      shell: pwsh
      env:
        SIGN_USERNAME: ${{ secrets.CERTUM_USERNAME }}
        SIGN_OTP_TOKEN: ${{ secrets.CERTUM_OTP_TOKEN }}
        CERTUM_FINGERPRINT: ${{ secrets.CERTUM_FINGERPRINT }}
        PUBLISH_PATH: "publish"   # 根据实际发布目录调整
      run: |
        $ErrorActionPreference = "Stop"

        # ---- 2.1 生成 OTP 并登录 ----
        pip install pyotp --quiet
        $otp = python -c "import pyotp; print(pyotp.TOTP('$env:SIGN_OTP_TOKEN', digest='SHA256').now())"

        $exe = "C:\Program Files\Certum\SimplySign Desktop\SimplySignDesktop.exe"
        if (-not (Test-Path $exe)) {
          Write-Error "SimplySignDesktop.exe not found at $exe"
          exit 1
        }

        Write-Host "Launching SimplySignDesktop with auto-login..."
        Start-Process -FilePath $exe -ArgumentList "/autologin", "$env:SIGN_USERNAME", "$otp" -NoNewWindow

        # ---- 2.2 轮询等待证书可用 ----
        $fingerprint = $env:CERTUM_FINGERPRINT
        Write-Host "Waiting for certificate with fingerprint $fingerprint to become available..."
        $certAvailable = $false
        $maxWaitSeconds = 60
        $waited = 0
        do {
          # 检查当前用户的个人证书存储中是否存在该指纹的证书
          $cert = Get-ChildItem -Path Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq $fingerprint }
          if ($cert) {
            $certAvailable = $true
            Write-Host "Certificate found after $waited seconds."
            break
          }
          Start-Sleep -Seconds 2
          $waited += 2
        } while ($waited -lt $maxWaitSeconds)

        if (-not $certAvailable) {
          Write-Error "Certificate did not appear within $maxWaitSeconds seconds."
          exit 1
        }

        # ---- 2.3 定位 signtool ----
        $signtool = "${{ github.workspace }}\tools\sign_windows\signtool.exe"
        if (-not (Test-Path $signtool)) {
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
        }
        if (-not $signtool) {
          Write-Error "signtool.exe not found"
          exit 1
        }
        Write-Host "Using signtool: $signtool"

        # ---- 2.4 扫描并签名发布目录下的 exe/dll（跳过已签名文件） ----
        $targetDir = Join-Path ${{ github.workspace }} $env:PUBLISH_PATH
        if (-not (Test-Path $targetDir)) {
          Write-Error "Publish directory not found: $targetDir"
          exit 1
        }

        $files = Get-ChildItem -Path $targetDir -Include *.exe,*.dll -Recurse
        Write-Host "Found $($files.Count) files to potentially sign."

        foreach ($file in $files) {
          # 检查是否已经签名（使用 /pa 默认验证策略）
          $alreadySigned = $false
          $verifyResult = & $signtool verify /pa $file.FullName 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "[SKIP] Already signed: $($file.Name)"
            $alreadySigned = $true
          }

          if (-not $alreadySigned) {
            Write-Host "Signing: $($file.Name)"
            & $signtool sign /v /fd sha256 /sha1 $fingerprint /tr "http://time.certum.pl" /td sha256 $file.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Sign failed for $($file.Name)"
              exit 1
            }
            Write-Host "[SUCCESS] Signed: $($file.Name)"
          }
        }

        # ---- 2.5 编译 Inno Setup 安装包并签名（如果存在 .iss 文件） ----
        $issPath = "${{ github.workspace }}\tools\installer.iss"
        if (Test-Path $issPath) {
          Write-Host "Compiling Inno Setup installer..."
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler not found at $iscc"
            exit 1
          }
          & $iscc $issPath /O+
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed"
            exit 1
          }

          # 查找生成的安装包（假设输出在 publish 目录或其父目录）
          $outputDir = Split-Path $issPath -Parent | Split-Path -Parent
          $installer = Get-ChildItem -Path $outputDir -Filter *setup*.exe -Recurse | Select-Object -First 1
          if ($installer) {
            Write-Host "Signing installer: $($installer.Name)"
            & $signtool sign /v /fd sha256 /sha1 $fingerprint /tr "http://time.certum.pl" /td sha256 $installer.FullName
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Installer signing failed"
              exit 1
            }
            Write-Host "[SUCCESS] Installer signed."
          } else {
            Write-Warning "Could not find compiled installer."
          }
        }

        Write-Host "=== All signing and packaging steps completed successfully ==="

    - name: Create release zip
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./Everywhere-Windows-x64-v$env:VERSION.zip

    - name: Upload Release Assets
      uses: softprops/action-gh-release@v3
      with:
        draft: true
        make_latest: false
        prerelease: ${{ env.PRERELEASE }}
        generate_release_notes: ${{ env.PRERELEASE }}
        tag_name: ${{ env.RELEASE_TAG }}
        files: |
          ./Everywhere-Windows-x64-v${{env.VERSION}}.zip
          ./Everywhere-Windows-x64-Setup-v${{env.VERSION}}.exe
