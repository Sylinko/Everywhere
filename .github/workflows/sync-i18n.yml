name: Sync i18n Resources

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**/I18N/Strings*.resx'
      - '.github/workflows/sync-i18n.yml'
      - 'tools/i18n/**'

jobs:
  sync-and-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Disable Git LFS
        run: |
          git lfs uninstall || true
          git config --global --unset filter.lfs.clean || true
          git config --global --unset filter.lfs.smudge || true
          git config --global --unset filter.lfs.process || true
          git config --global --unset filter.lfs.required || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false  # Disable LFS for bandwidth saving

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: python -m pip install openai==3.51.0 defusedxml==0.7.1

      - name: Run i18n Sync Script
        run: python tools/i18n/sync.py --api responses --base-url https://api.openai.com/v1 --model-id gpt-6-luna
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Validate synchronized resources
        run: python tools/i18n/validate.py

      - name: Create Pull Request with Translations
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(i18n): Automatically sync localization files'
          title: '🌐 AI-Powered i18n Synchronization'
          body: |
            This PR was automatically generated by the `sync-i18n` workflow.

            Missing resources are translated from `Strings.zh-hans.resx`. Target files follow the source key order.
          branch: 'chore/i18n-sync'
          branch-suffix: 'short-commit-hash'
          labels: 'i18n, automated'
