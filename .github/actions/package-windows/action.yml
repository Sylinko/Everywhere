name: Package Windows
description: Build, sign and collect the x64 installer and portable ZIP.
inputs:
  sentry-dsn:
    description: Sentry DSN embedded in the application.
    required: true
  client-id:
    description: Account client ID embedded in the application.
    required: true
  certum-username:
    description: SimplySign account.
    required: true
  certum-otp-token:
    description: SimplySign one-time password seed.
    required: true
  certum-fingerprint:
    description: Signing certificate fingerprint.
    required: true
runs:
  using: composite
  steps:
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Install Inno Setup
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference = "Stop"
        $version = "7.1.1"
        $release = "is-7_1_1"
        $asset = "innosetup-$version-x64.exe"
        $installerPath = Join-Path $env:RUNNER_TEMP $asset
        $installDirectory = Join-Path $env:RUNNER_TEMP "Inno Setup 7"

        gh release download $release --repo jrsoftware/issrc --pattern $asset --dir $env:RUNNER_TEMP
        if ($LASTEXITCODE -ne 0) {
            throw "Failed to download Inno Setup $version."
        }
        gh release verify-asset $release $installerPath --repo jrsoftware/issrc
        if ($LASTEXITCODE -ne 0) {
            throw "GitHub attestation verification failed for Inno Setup $version."
        }

        $process = Start-Process $installerPath `
          -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/ALLUSERS", "/DIR=`"$installDirectory`"" `
          -Wait -PassThru
        if ($process.ExitCode -ne 0) {
            throw "Inno Setup $version installation failed with exit code $($process.ExitCode)."
        }

        $compilerPath = Join-Path $installDirectory "ISCC.exe"
        if (-not (Test-Path $compilerPath)) {
            throw "Inno Setup compiler was not installed at $compilerPath."
        }
        "INNO_SETUP_COMPILER=$compilerPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install SimplySignDesktop
      shell: pwsh
      run: |
        $msiPath = "tools/sign_windows/SimplySignDesktop-9.3.3.71-64-bit-en.msi"
        if (-not (Test-Path $msiPath)) {
            Write-Error "MSI file not found at: $msiPath"
            exit 1
        }

        $absMsiPath = Convert-Path $msiPath
        $logPath = "$PWD\install.log"

        Write-Host "Installing SimplySignDesktop from $absMsiPath..."
        # Use /qn for completely silent installation (no UI) and ALLUSERS=1 to force machine-wide install
        $process = Start-Process msiexec -ArgumentList "/i `"$absMsiPath`" /qn /norestart ALLUSERS=1 /l*v `"$logPath`"" -Wait -PassThru

        if ($process.ExitCode -ne 0) {
            Write-Host "SimplySignDesktop installation failed with exit code $($process.ExitCode)"
            if (Test-Path $logPath) {
                Write-Host "----------------------------------------------------------------"
                Write-Host "Install Log Content:"
                Write-Host "----------------------------------------------------------------"
                Get-Content $logPath
                Write-Host "----------------------------------------------------------------"
            } else {
                Write-Host "Log file not found at $logPath"
            }
            exit $process.ExitCode
        }
        Write-Host "SimplySignDesktop installed successfully."

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'

    - name: Restore
      shell: pwsh
      run: |
        dotnet restore Everywhere.Windows.slnx -r win-x64

    - name: Publish Everywhere.Windows
      shell: pwsh
      env:
        SENTRY_DSN: ${{ inputs.sentry-dsn }}
        CLIENT_ID: ${{ inputs.client-id }}
      run: |
        dotnet publish src/Everywhere.Windows/Everywhere.Windows.csproj `
          -c Release `
          --self-contained true `
          -p:Version="$env:VERSION_PREFIX" `
          -p:SemanticVersion="$env:SEMANTIC_VERSION" `
          -p:SentryDsn="$env:SENTRY_DSN" `
          -p:ClientId="$env:CLIENT_ID" `
          -p:AIGatewayBaseUrl="$env:AI_GATEWAY_BASE_URL" `
          -p:CloudBaseUrl="$env:CLOUD_BASE_URL" `
          -p:AccountBaseUrl="$env:ACCOUNT_BASE_URL" `
          -o ./publish `
          --no-restore

    - name: Login, Compile, and Sign
      shell: pwsh
      env:
        SIGN_USERNAME: ${{ inputs.certum-username }}
        SIGN_OTP_TOKEN: ${{ inputs.certum-otp-token }}
        SIGN_FINGERPRINT: ${{ inputs.certum-fingerprint }}
      run: |
        python -m pip install --upgrade pip
        pip install pyotp
        python -u tools/sign_and_pack.py ./publish tools/installer.iss

    - name: Collect signed Windows assets
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path release-assets -Force | Out-Null
        Compress-Archive -Path ./publish/* -DestinationPath "release-assets/Everywhere-Windows-x64-$env:RELEASE_TAG.zip"
        Move-Item -LiteralPath "Everywhere-Windows-x64-Setup-$env:RELEASE_TAG.exe" -Destination release-assets
